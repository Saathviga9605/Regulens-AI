[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "regulens-backend"
version = "0.1.0"
description = "ReguLens AI backend: evidence-first regulatory scrutiny assistant (foundation)."
requires-python = ">=3.11"
# Ranges here; exact versions are locked in requirements.lock.txt.
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "SQLAlchemy>=2.0.30,<2.1",
  "alembic>=1.13,<2",
  "python-multipart>=0.0.18,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.db" = ["migrations/*.py", "migrations/versions/*.py", "migrations/script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
